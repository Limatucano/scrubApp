name: Build Homolog APK

on:
  push:
    branches:
      - homolog

permissions:
  contents: write  # necessário para criar Releases e fazer upload de artefatos

jobs:
  build:
    name: Build & Upload APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. JDK ───────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Permissão no gradlew ───────────────────────────────────
      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # ── 4. Cache Gradle ───────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 5. Decode keystore (Base64 → arquivo) ────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/keystore.jks

      # ── 6. Build APK de release assinado ─────────────────────────
      - name: Build release APK
        run: ./gradlew :composeApp:assembleRelease
        env:
          SIGNING_KEY_ALIAS:       ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD:    ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD:  ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE:      ${{ github.workspace }}/keystore.jks

      # ── 7. Renomeia o APK com a data + sha do commit ─────────────
      - name: Rename APK
        run: |
          DATE=$(date +'%Y%m%d-%H%M')
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          APK_NAME="scrubs-homolog-${DATE}-${SHA}.apk"
          mv composeApp/build/outputs/apk/release/composeApp-release.apk \
             composeApp/build/outputs/apk/release/${APK_NAME}
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV

      # ── 8. Upload como artefato no GitHub ────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: composeApp/build/outputs/apk/release/${{ env.APK_NAME }}
          retention-days: 30

      # ── 9. (Opcional) Cria uma Release no GitHub com o APK ───────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: homolog-${{ github.run_number }}
          name: "Homolog Build #${{ github.run_number }}"
          body: |
            🔨 Build gerado automaticamente a partir da branch `homolog`
            📝 Commit: ${{ github.sha }}
            👤 Por: ${{ github.actor }}
          files: composeApp/build/outputs/apk/release/${{ env.APK_NAME }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
